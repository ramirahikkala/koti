# Heating zone configuration. Re-read on every control cycle - edits need no restart.
#
# Two levels:
#   boiler  - level 1, on/off, price-driven blocking of the electric boiler
#   rooms   - level 2, one entry per room (control: trv | onoff)
#
# Everything is MQTT. Topic conventions:
#   temp_topic       - ESPHome gateway sensor state, koti/sensor/<slug>/state (all gateways
#                      share the `koti` prefix, so a topic doesn't change if the tag moves node)
#   switch_topic     - Shelly relay prefix; controller uses <prefix>/command|status/<component>
#   trv_ext_temp_topic - retained topic the TRV bridge ESP (gateway-01) reads and forwards to
#                        the Shelly TRV over LAN HTTP (GET /ext_t?temp=X); the TRV itself
#                        can't reach the TLS-only cloud broker
# Discover a topic with:
#   mosquitto_sub -h mqtt.ketunmetsa.fi -p 8883 -u ha -P '<pw>' -t 'koti/#' -v

boiler:
  enabled: true
  switch_topic: shelly1minig3-5432045dd3f0
  # switch_component: "switch:0"  # default
  inverted: true                 # relay ON = boiler blocked
  max_shutoff_hours: 6.0
  price_always_on_threshold: 5.0  # c/kWh - below this the boiler is never blocked

rooms:
  defaults:
    price_low_threshold: 10.0     # c/kWh where the room setpoint adjustment is 0
    temp_variation: 0.5           # max +/- setpoint shift (degC)

  items:
    - id: olohuone
      control: onoff
      temp_topic: koti/sensor/sisa_alakerta/state
      switch_topic: shelly1minig3-5432044efb74
      requests_boiler_heat: true  # forces the boiler on when this room wants heat
      base_temp:                  # controller-owned MQTT number (HA shows a slider)
        default: 21.0
        min: 15.0
        max: 25.0
        step: 0.5

    # Shelly TRV: the controller publishes a price-adjusted "external temperature" (retained)
    # to koti/trv/<room>/ext_t. gateway-01 subscribes and forwards it to the TRV over LAN
    # HTTP every few minutes (battery TRVs duty-cycle their WiFi). Topics are ours to name.
    - id: kylpyhuone
      control: trv
      temp_topic: koti/sensor/kylpyhuone/state
      trv_ext_temp_topic: koti/trv/kylpyhuone/ext_t
      requests_boiler_heat: false

    - id: khh
      control: trv
      temp_topic: koti/sensor/khh/state
      trv_ext_temp_topic: koti/trv/khh/ext_t
      requests_boiler_heat: false
