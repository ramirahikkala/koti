[project]
name = "koti"
version = "0.1.0"
description = "Home automation services (headless) — MQTT/HA as the substrate. First: the price-aware heating controller."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "paho-mqtt>=2.1",
    "structlog>=24.1",
]

[project.scripts]
heating = "koti.heating.scheduler:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koti"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["koti"]
mypy_path = "src"
strict = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "paho.*"]
ignore_missing_imports = true
follow_imports = "skip"
